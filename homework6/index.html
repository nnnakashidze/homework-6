<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      @import "https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap";
    </style>
  </head>
  <body>
    <div class="maincontainer">
      <div class="formcontainer">
        <h1>Get in <span class="touchcontainer">Touch</span></h1>
        <p class="discription">
          Enim tempor eget pharetra facilisis sed maecenas adipiscing. Eu leo
          molestie vel, ornare non id blandit netus.
        </p>
        <form class="form">
          <input type="text" placeholder="Name *" class="inputbox" />
          <input type="email" placeholder="Email *" class="inputbox" />
          <input type="tel" placeholder="Phone number *" class="inputbox" />
          <div class="dropdown">
            <select>
              <option>How did you find us?</option>
            </select>
          </div>
          <button type="submit" class="sendbutton">SEND</button>
        </form>
        <div class="contactinfo">
          <div class="contactitem">
            <span class="icon"><img src="image/phone.svg" alt="phone" /></span>
            <div class="contacttext">
              <p class="title">PHONE</p>
              <p class="info">03 5432 1234</p>
            </div>
          </div>
          <div class="contactitem">
            <span class="icon"><img src="image/fax.svg" alt="fax" /></span>
            <div class="contacttext">
              <p class="title">FAX</p>
              <p class="info">03 5432 1234</p>
            </div>
          </div>
          <div class="contactitem">
            <span class="icon"><img src="image/email.svg" alt="email" /></span>
            <div class="contacttext">
              <p class="title">EMAIL</p>
              <p class="info">info@marcc.com.au</p>
            </div>
          </div>
        </div>
      </div>
      <div class="mapcontainer">
        <img src="image/Component 6.png" alt="map" />
      </div>
      <div class="bluebackground"></div>
    </div>
  </body>
</html>
